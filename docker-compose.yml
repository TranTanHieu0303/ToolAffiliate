version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: toolaffiliate_postgres
    restart: always
    environment:
      POSTGRES_USER: affiliate_user
      POSTGRES_PASSWORD: SecretPassword2026 # Bạn nên đổi mật khẩu này khi lên VPS
      POSTGRES_DB: toolaffiliate_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U affiliate_user -d toolaffiliate_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toolaffiliate_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://affiliate_user:SecretPassword2026@db:5432/toolaffiliate_db?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: toolaffiliate_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
